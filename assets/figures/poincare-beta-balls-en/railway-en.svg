<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
  <title id="title">A finite-branch railway mm-space at λ = 2: distance and sampling</title>
  <desc id="desc">Dashed segments from O to each support start have length 1. Open circles mark support starts; solid branches continue infinitely. Choose branches 1, 2, 3 with probabilities one half, one third, one sixth, then independently E with density exp(-e), and set s=2+E. The conditional probability of coordinates 2 to 3 on any branch is 1-exp(-1). Coordinates 3 and 4 on different branches have distance 5 through the center; on one branch their distance is 1.</desc>
  <style>
    :root {
      --background: #f5f7fb;
      --ink: #26384b;
      --muted: #526274;
      --surface: #fff;
      --border: #dce3ec;
      --highlight: #e0a136;
      --dashed: #77869a;
      --branch-one: #246891;
      --branch-two: #9a5733;
      --branch-three: #52816c;
      --center: #526274;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #17191c;
        --ink: #e5e7eb;
        --muted: #b0b7c1;
        --surface: #22262b;
        --border: #414750;
        --highlight: #e1a54d;
        --dashed: #a0aab4;
        --branch-one: #6fb8e1;
        --branch-two: #e0a074;
        --branch-three: #78c797;
        --center: #bdc6d0;
      }
    }
  </style>
  <rect width="960" height="740" rx="16" fill="var(--background)"/>
  <g font-family="sans-serif" fill="var(--ink)">
    <text x="32" y="44" font-size="28">Finite-branch railway mm-space at λ = 2</text>
    <text x="32" y="77" font-size="18">Branch coordinate s differs from distance s − λ/2 to the center</text>
  </g>

  <!-- One metric unit is 70 SVG units on every ray: (56, −42), (−56, −42), (0, 70). -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M446 226 L334 310 L166 184" stroke="var(--highlight)" stroke-width="16" opacity=".5"/>
    <path d="M334 310 L390 268 M334 310 L278 268 M334 310 L334 380" stroke="var(--dashed)" stroke-width="3" stroke-dasharray="6 7"/>
    <path d="M390 268 L558 142" stroke="var(--branch-one)" stroke-width="5"/>
    <path d="M278 268 L110 142" stroke="var(--branch-two)" stroke-width="5"/>
    <path d="M334 380 L334 492" stroke="var(--branch-three)" stroke-width="5"/>
    <path d="M547 143 L558 142 L554 153" stroke="var(--branch-one)" stroke-width="3"/>
    <path d="M114 153 L110 142 L121 143" stroke="var(--branch-two)" stroke-width="3"/>
    <path d="M328 482 L334 492 L340 482" stroke="var(--branch-three)" stroke-width="3"/>
    <path d="M345 345 L358 345" stroke="var(--dashed)" stroke-width="2"/>
  </g>
  <g fill="var(--background)" stroke="var(--center)" stroke-width="2">
    <circle cx="390" cy="268" r="7"/>
    <circle cx="278" cy="268" r="7"/>
    <circle cx="334" cy="380" r="7"/>
  </g>
  <circle cx="334" cy="310" r="5" fill="var(--center)"/>
  <circle cx="446" cy="226" r="8" fill="var(--branch-one)" stroke="var(--background)" stroke-width="2"/>
  <circle cx="502" cy="184" r="6" fill="var(--background)" stroke="var(--branch-one)" stroke-width="3"/>
  <circle cx="166" cy="184" r="8" fill="var(--branch-two)" stroke="var(--background)" stroke-width="2"/>
  <g font-family="sans-serif" fill="var(--ink)" font-size="22">
    <text x="422" y="117" fill="var(--branch-one)">Branch 1: p₁ = 1/2</text>
    <text x="44" y="117" fill="var(--branch-two)">Branch 2: p₂ = 1/3</text>
    <text x="365" y="464" fill="var(--branch-three)">Branch 3: p₃ = 1/6</text>
    <text x="462" y="250">s = 3</text>
    <text x="517" y="210" font-size="18">s = 4</text>
    <text x="145" y="159">t = 4</text>
    <text x="405" y="297" font-size="18">s = 2</text>
    <text x="350" y="329">O</text>
    <text x="369" y="353" font-size="18">λ/2 = 1</text>
  </g>

  <rect x="650" y="117" width="278" height="350" rx="12" fill="var(--surface)" stroke="var(--border)"/>
  <g font-family="sans-serif" fill="var(--ink)">
    <text x="672" y="155" font-size="19">Cross-branch distance</text>
    <text x="672" y="200" font-size="19">d = (s − 1) + (t − 1)</text>
    <text x="672" y="238" font-size="24">  = 2 + 3 = 5</text>
    <path d="M672 263 H906" stroke="var(--border)"/>
    <text x="672" y="298" font-size="18">Lengths to the center</text>
    <text x="672" y="339" font-size="19">s = 3:3 − 1 = 2</text>
    <text x="672" y="377" font-size="19">t = 4:4 − 1 = 3</text>
    <path d="M672 400 H906" stroke="var(--border)"/>
    <text x="672" y="438" font-size="18">Same branch: |3 − 4| = 1</text>
  </g>

  <g font-family="sans-serif" fill="var(--muted)" font-size="18">
    <path d="M32 548 H73" fill="none" stroke="var(--dashed)" stroke-width="3" stroke-dasharray="6 7"/>
    <text x="88" y="555">Dashed: outside the support (length 1 to each branch start)</text>
    <path d="M32 582 H73 M65 577 L73 582 L65 587" fill="none" stroke="var(--branch-three)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="589">Solid: probability support (continues beyond the arrows)</text>
  </g>

  <rect x="32" y="620" width="896" height="96" rx="12" fill="var(--surface)" stroke="var(--border)"/>
  <g font-family="sans-serif" fill="var(--ink)" font-size="19">
    <text x="52" y="656">Choose branch i with probability pᵢ → independently E ∼ Exp(1) → s = 2 + E</text>
    <text x="52" y="694">On each branch: P(2 ≤ s ≤ 3) = 1 − e⁻¹ (density is greater near the start)</text>
  </g>
</svg>
