<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 350" role="img" aria-labelledby="title desc">
  <title id="title">Keep slope one near the mass-selected boundaries</title>
  <desc id="desc">For the probability measure with equal atoms at 0, 1, 5 and 6 and retained mass one half, the chosen boundaries are 1 and 5. The map has slope one on (0,2) and (4,6), and slope zero elsewhere. The atoms map to -2, -1, 1 and 2, retaining partial diameter one.</desc>
  <style>
    :root {
      --background: #fff;
      --ink: #293a43;
      --border: #d9e0e4;
      --axis: #85949c;
      --guide: #c0cbd0;
      --preserve: #337a62;
      --collapse: #7d8b94;
      --atom: #234e76;
      --atom-border: #fff;
      --highlight: #eef6f1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #17191c;
        --ink: #e5e7eb;
        --border: #414750;
        --axis: #a2aeba;
        --guide: #68737f;
        --preserve: #72c49f;
        --collapse: #a0aab4;
        --atom: #5a9dd0;
        --atom-border: #17191c;
        --highlight: #20312c;
      }
    }
    text {font-family: system-ui, sans-serif; fill: var(--ink); font-size: 15px}
    .heading {font-size: 20px; font-weight: 650}
    .axis {stroke: var(--axis); stroke-width: 1.5}
    .guide {stroke: var(--guide); stroke-width: 1; stroke-dasharray: 4 4}
    .preserve {stroke: var(--preserve); stroke-width: 5; fill: none}
    .collapse {stroke: var(--collapse); stroke-width: 5; fill: none}
    .atom {fill: var(--atom); stroke: var(--atom-border); stroke-width: 2}
  </style>
  <rect x="1" y="1" width="818" height="348" rx="12" fill="var(--background)" stroke="var(--border)"/>
  <text x="410" y="32" text-anchor="middle" class="heading">Preserve boundary neighborhoods; contract the gaps</text>
  <rect x="170" y="55" width="160" height="220" fill="var(--highlight)"/>
  <rect x="490" y="55" width="160" height="220" fill="var(--highlight)"/>
  <line x1="105" y1="165" x2="715" y2="165" class="axis"/>
  <line x1="170" y1="55" x2="170" y2="277" class="axis"/>
  <text x="725" y="170">x</text><text x="148" y="57">f(x)</text>
  <line x1="170" y1="265" x2="650" y2="265" class="guide"/>
  <line x1="170" y1="65" x2="650" y2="65" class="guide"/>
  <text x="147" y="270" text-anchor="end">−2</text><text x="147" y="70" text-anchor="end">2</text>
  <polyline points="105,265 170,265" class="collapse"/>
  <polyline points="170,265 330,165" class="preserve"/>
  <polyline points="330,165 490,165" class="collapse"/>
  <polyline points="490,165 650,65" class="preserve"/>
  <polyline points="650,65 715,65" class="collapse"/>
  <circle cx="170" cy="265" r="6" class="atom"/>
  <circle cx="250" cy="215" r="6" class="atom"/>
  <circle cx="570" cy="115" r="6" class="atom"/>
  <circle cx="650" cy="65" r="6" class="atom"/>
  <text x="170" y="295" text-anchor="middle">0</text><text x="250" y="295" text-anchor="middle">1</text>
  <text x="330" y="295" text-anchor="middle">2</text><text x="490" y="295" text-anchor="middle">4</text>
  <text x="570" y="295" text-anchor="middle">5</text><text x="650" y="295" text-anchor="middle">6</text>
  <line x1="250" y1="221" x2="250" y2="280" class="guide"/>
  <line x1="570" y1="121" x2="570" y2="280" class="guide"/>
  <text x="250" y="92" text-anchor="middle" fill="var(--preserve)">Boundary x₁ = 1</text>
  <text x="570" y="245" text-anchor="middle" fill="var(--preserve)">Boundary x₂ = 5</text>
  <text x="410" y="150" text-anchor="middle">Slope 0</text>
  <text x="410" y="329" text-anchor="middle">Each sample has mass 1/4. Partial diameter at mass 1/2 remains 1 after mapping.</text>
</svg>
