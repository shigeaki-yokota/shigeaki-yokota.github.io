<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">同じ半直線に載る二つの確率</title>
  <desc id="desc">実一次元では二点−rとrが、複素一次元では半径rの円全体が、一つの半径rにまとまる。どちらの商でも距離は半径の差の絶対値になる。実数の商には半正規分布χ₁（r>0での密度は√(2/π)exp(−r²/2)）、複素数の商にはχ₂分布（密度はr exp(−r²/2)）が載る。ξとηは独立な標準正規変数。右側の曲線は密度で、χ₁はr=0で最大、χ₂はr=0で0から立ち上がりr=1で最大になる。定義から描いた説明用の模式図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrowhead"/>
    </marker>
  </defs>
  <style>
    :root { --background:#fff; --panel:#f3f6f8; --ink:#293a43; --border:#d9e0e4; --axis:#85949c; --atom:#234e76; --atom-border:#fff; --law:#1d5f8f; --rad:#b4532a; }
    @media (prefers-color-scheme: dark) { :root { --background:#17191c; --panel:#20242a; --ink:#e5e7eb; --border:#414750; --axis:#a2aeba; --atom:#5a9dd0; --atom-border:#17191c; --law:#7fb8e3; --rad:#f0a070; } }
    text {font-family: system-ui, "Noto Sans JP", sans-serif; fill: var(--ink); font-size: 20px}
    .heading {font-size: 24px; font-weight: 650}
    .sub {font-size: 18px}
    .axis {stroke: var(--axis); stroke-width: 2; fill: none}
    .map {stroke: var(--axis); stroke-width: 2; fill: none; marker-end: url(#arrow)}
    .arrowhead {fill: var(--axis)}
    .atom {fill: var(--atom); stroke: var(--atom-border); stroke-width: 2}
    .orbit {stroke: var(--atom); stroke-width: 3; fill: none}
    .arc {stroke: var(--atom); stroke-width: 2.5; fill: none; stroke-dasharray: 5 5}
    .radius {stroke: var(--rad); stroke-width: 2.5; stroke-dasharray: 6 5}
    .law {fill: var(--law); font-weight: 600}
    .radtxt {fill: var(--rad)}
    .dens {stroke: var(--law); stroke-width: 3; fill: none}
    .densfill {fill: var(--law); fill-opacity: 0.16; stroke: none}
    .note {font-size: 17px; fill: var(--rad)}
  </style>
  <rect x="1" y="1" width="958" height="598" rx="12" fill="var(--background)" stroke="var(--border)"/>
  <text x="480" y="38" text-anchor="middle" class="heading">同じ半直線に、異なる確率が載る</text>

  <rect x="24" y="58" width="912" height="240" rx="10" fill="var(--panel)"/>
  <text x="44" y="92" class="heading">実一次元：符号を忘れる</text>
  <text x="44" y="120" class="sub">x と −x を同じ点とみなす</text>
  <line x1="66" y1="200" x2="364" y2="200" class="axis"/>
  <line x1="215" y1="194" x2="215" y2="206" class="axis"/>
  <path d="M 125 182 Q 215 140 305 182" class="arc"/>
  <circle cx="125" cy="200" r="8" class="atom"/>
  <circle cx="305" cy="200" r="8" class="atom"/>
  <text x="125" y="236" text-anchor="middle">−r</text>
  <text x="215" y="236" text-anchor="middle">0</text>
  <text x="305" y="236" text-anchor="middle">r</text>
  <path d="M 392 195 L 510 195" class="map"/>
  <text x="451" y="176" text-anchor="middle">x ↦ |x|</text>
  <line x1="563" y1="200" x2="890" y2="200" class="axis" marker-end="url(#arrow)"/>
  <circle cx="700" cy="200" r="8" class="atom"/>
  <text x="563" y="236" text-anchor="middle">0</text>
  <text x="700" y="236" text-anchor="middle">r</text>
  <text x="560" y="272" class="law">χ₁：|ξ| の分布（半正規分布）</text>
  <path d="M 563.0 88.3 L 567.0 88.4 L 571.0 88.9 L 575.0 89.5 L 579.0 90.5 L 583.0 91.7 L 587.0 93.2 L 591.0 94.9 L 595.0 96.9 L 599.0 99.1 L 603.0 101.4 L 607.0 104.0 L 611.0 106.7 L 615.0 109.6 L 619.0 112.6 L 623.0 115.7 L 627.0 118.9 L 631.0 122.2 L 635.0 125.5 L 639.0 128.9 L 643.0 132.2 L 647.0 135.6 L 651.0 139.0 L 655.0 142.3 L 659.0 145.6 L 663.0 148.9 L 667.0 152.0 L 671.0 155.1 L 675.0 158.1 L 679.0 161.0 L 683.0 163.7 L 687.0 166.4 L 691.0 168.9 L 695.0 171.4 L 699.0 173.7 L 703.0 175.8 L 707.0 177.9 L 711.0 179.8 L 715.0 181.6 L 719.0 183.3 L 723.0 184.9 L 727.0 186.3 L 731.0 187.7 L 735.0 188.9 L 739.0 190.1 L 743.0 191.1 L 747.0 192.1 L 751.0 192.9 L 755.0 193.7 L 759.0 194.4 L 763.0 195.1 L 767.0 195.7 L 771.0 196.2 L 775.0 196.7 L 779.0 197.1 L 783.0 197.5 L 787.0 197.8 L 791.0 198.1 L 795.0 198.3 L 799.0 198.6 L 803.0 198.8 L 807.0 198.9 L 811.0 199.1 L 815.0 199.2 L 819.0 199.3 L 823.0 199.4 L 827.0 199.5 L 831.0 199.6 L 835.0 199.7 L 839.0 199.7 L 843.0 199.8 L 847.0 199.8 L 851.0 199.8 L 855.0 199.9 L 859.0 199.9 L 863.0 199.9 L 867.0 199.9 L 871.0 199.9 L 875.0 199.9 L 879.0 200.0 L 883.0 200.0 L 883.0 200 L 563 200 Z" class="densfill"/>
  <path d="M 563.0 88.3 L 567.0 88.4 L 571.0 88.9 L 575.0 89.5 L 579.0 90.5 L 583.0 91.7 L 587.0 93.2 L 591.0 94.9 L 595.0 96.9 L 599.0 99.1 L 603.0 101.4 L 607.0 104.0 L 611.0 106.7 L 615.0 109.6 L 619.0 112.6 L 623.0 115.7 L 627.0 118.9 L 631.0 122.2 L 635.0 125.5 L 639.0 128.9 L 643.0 132.2 L 647.0 135.6 L 651.0 139.0 L 655.0 142.3 L 659.0 145.6 L 663.0 148.9 L 667.0 152.0 L 671.0 155.1 L 675.0 158.1 L 679.0 161.0 L 683.0 163.7 L 687.0 166.4 L 691.0 168.9 L 695.0 171.4 L 699.0 173.7 L 703.0 175.8 L 707.0 177.9 L 711.0 179.8 L 715.0 181.6 L 719.0 183.3 L 723.0 184.9 L 727.0 186.3 L 731.0 187.7 L 735.0 188.9 L 739.0 190.1 L 743.0 191.1 L 747.0 192.1 L 751.0 192.9 L 755.0 193.7 L 759.0 194.4 L 763.0 195.1 L 767.0 195.7 L 771.0 196.2 L 775.0 196.7 L 779.0 197.1 L 783.0 197.5 L 787.0 197.8 L 791.0 198.1 L 795.0 198.3 L 799.0 198.6 L 803.0 198.8 L 807.0 198.9 L 811.0 199.1 L 815.0 199.2 L 819.0 199.3 L 823.0 199.4 L 827.0 199.5 L 831.0 199.6 L 835.0 199.7 L 839.0 199.7 L 843.0 199.8 L 847.0 199.8 L 851.0 199.8 L 855.0 199.9 L 859.0 199.9 L 863.0 199.9 L 867.0 199.9 L 871.0 199.9 L 875.0 199.9 L 879.0 200.0 L 883.0 200.0" class="dens"/>
  <text x="572" y="80" class="note">r=0 で最大</text>
  <text x="700" y="118" class="sub">密度 √(2/π) e^(−r²/2)</text>

  <rect x="24" y="314" width="912" height="240" rx="10" fill="var(--panel)"/>
  <text x="44" y="348" class="heading">複素一次元（実二次元）：位相を忘れる</text>
  <text x="44" y="376" class="sub">z と e^(iθ)z を同じ点とみなす</text>
  <line x1="95" y1="466" x2="335" y2="466" class="axis"/>
  <line x1="215" y1="396" x2="215" y2="538" class="axis"/>
  <circle cx="215" cy="466" r="60" class="orbit"/>
  <line x1="215" y1="466" x2="257" y2="424" class="radius"/>
  <circle cx="257" cy="424" r="7" class="atom"/>
  <text x="226" y="436" class="radtxt">r</text>
  <path d="M 392 466 L 510 466" class="map"/>
  <text x="451" y="446" text-anchor="middle">z ↦ |z|</text>
  <line x1="563" y1="466" x2="890" y2="466" class="axis" marker-end="url(#arrow)"/>
  <circle cx="700" cy="466" r="8" class="atom"/>
  <text x="563" y="502" text-anchor="middle">0</text>
  <text x="700" y="502" text-anchor="middle">r</text>
  <text x="560" y="535" class="law">χ₂：√(ξ²+η²) の分布</text>
  <path d="M 563.0 466.0 L 567.0 459.0 L 571.0 452.1 L 575.0 445.2 L 579.0 438.6 L 583.0 432.1 L 587.0 425.8 L 591.0 419.9 L 595.0 414.3 L 599.0 409.1 L 603.0 404.2 L 607.0 399.8 L 611.0 395.8 L 615.0 392.3 L 619.0 389.3 L 623.0 386.7 L 627.0 384.7 L 631.0 383.1 L 635.0 382.0 L 639.0 381.3 L 643.0 381.1 L 647.0 381.3 L 651.0 381.9 L 655.0 382.9 L 659.0 384.2 L 663.0 385.9 L 667.0 387.8 L 671.0 390.0 L 675.0 392.4 L 679.0 395.1 L 683.0 397.8 L 687.0 400.7 L 691.0 403.7 L 695.0 406.8 L 699.0 409.9 L 703.0 413.0 L 707.0 416.1 L 711.0 419.2 L 715.0 422.2 L 719.0 425.2 L 723.0 428.1 L 727.0 430.9 L 731.0 433.6 L 735.0 436.2 L 739.0 438.6 L 743.0 440.9 L 747.0 443.1 L 751.0 445.2 L 755.0 447.1 L 759.0 448.9 L 763.0 450.6 L 767.0 452.2 L 771.0 453.6 L 775.0 454.9 L 779.0 456.1 L 783.0 457.2 L 787.0 458.2 L 791.0 459.1 L 795.0 459.9 L 799.0 460.7 L 803.0 461.3 L 807.0 461.9 L 811.0 462.4 L 815.0 462.9 L 819.0 463.3 L 823.0 463.7 L 827.0 464.0 L 831.0 464.3 L 835.0 464.5 L 839.0 464.7 L 843.0 464.9 L 847.0 465.1 L 851.0 465.2 L 855.0 465.3 L 859.0 465.4 L 863.0 465.5 L 867.0 465.6 L 871.0 465.7 L 875.0 465.7 L 879.0 465.8 L 883.0 465.8 L 883.0 466 L 563 466 Z" class="densfill"/>
  <path d="M 563.0 466.0 L 567.0 459.0 L 571.0 452.1 L 575.0 445.2 L 579.0 438.6 L 583.0 432.1 L 587.0 425.8 L 591.0 419.9 L 595.0 414.3 L 599.0 409.1 L 603.0 404.2 L 607.0 399.8 L 611.0 395.8 L 615.0 392.3 L 619.0 389.3 L 623.0 386.7 L 627.0 384.7 L 631.0 383.1 L 635.0 382.0 L 639.0 381.3 L 643.0 381.1 L 647.0 381.3 L 651.0 381.9 L 655.0 382.9 L 659.0 384.2 L 663.0 385.9 L 667.0 387.8 L 671.0 390.0 L 675.0 392.4 L 679.0 395.1 L 683.0 397.8 L 687.0 400.7 L 691.0 403.7 L 695.0 406.8 L 699.0 409.9 L 703.0 413.0 L 707.0 416.1 L 711.0 419.2 L 715.0 422.2 L 719.0 425.2 L 723.0 428.1 L 727.0 430.9 L 731.0 433.6 L 735.0 436.2 L 739.0 438.6 L 743.0 440.9 L 747.0 443.1 L 751.0 445.2 L 755.0 447.1 L 759.0 448.9 L 763.0 450.6 L 767.0 452.2 L 771.0 453.6 L 775.0 454.9 L 779.0 456.1 L 783.0 457.2 L 787.0 458.2 L 791.0 459.1 L 795.0 459.9 L 799.0 460.7 L 803.0 461.3 L 807.0 461.9 L 811.0 462.4 L 815.0 462.9 L 819.0 463.3 L 823.0 463.7 L 827.0 464.0 L 831.0 464.3 L 835.0 464.5 L 839.0 464.7 L 843.0 464.9 L 847.0 465.1 L 851.0 465.2 L 855.0 465.3 L 859.0 465.4 L 863.0 465.5 L 867.0 465.6 L 871.0 465.7 L 875.0 465.7 L 879.0 465.8 L 883.0 465.8" class="dens"/>
  <text x="572" y="368" class="note">r=0 で 0、r=1 で最大</text>
  <text x="745" y="408" class="sub">密度 r e^(−r²/2)</text>
  <text x="480" y="582" text-anchor="middle" class="sub">どちらの商でも距離は |r − s|。違いは密度の形にある：χ₁ は r=0 で最大、χ₂ は r=0 で 0。</text>
</svg>
