<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-labelledby="title desc">
  <title id="title">幾何学的データ集合の三つの構成要素</title>
  <desc id="desc">点の空間Xと確率測度μ、特徴関数の族Fから、特徴差の上限で距離dFを定める模式図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#496b83" />
    </marker>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", sans-serif; fill: #243746; }
      .box { fill: #f6f8fa; stroke: #8397a6; stroke-width: 2; rx: 16; }
      .main { font-size: 25px; font-weight: 700; }
      .sub { font-size: 16px; }
      .math { font-family: Georgia, serif; font-size: 22px; }
      .arrow { stroke: #496b83; stroke-width: 2.5; marker-end: url(#arrow); }
      .dot { fill: #3478a5; }
    </style>
  </defs>
  <rect x="25" y="42" width="245" height="210" class="box" />
  <text x="147" y="80" text-anchor="middle" class="main">点と確率</text>
  <text x="147" y="116" text-anchor="middle" class="math">(X, μ)</text>
  <circle cx="95" cy="163" r="7" class="dot" /><circle cx="144" cy="151" r="7" class="dot" />
  <circle cx="185" cy="190" r="7" class="dot" /><circle cx="111" cy="211" r="7" class="dot" />
  <circle cx="206" cy="137" r="7" class="dot" />
  <text x="147" y="239" text-anchor="middle" class="sub">どこに、どれだけ質量があるか</text>

  <rect x="347" y="42" width="245" height="210" class="box" />
  <text x="469" y="80" text-anchor="middle" class="main">観測する量</text>
  <text x="469" y="116" text-anchor="middle" class="math">F ⊂ ℝˣ</text>
  <path d="M395 194 C420 154, 442 207, 466 166 S516 150, 542 190" fill="none" stroke="#3478a5" stroke-width="3" />
  <path d="M395 209 C425 184, 446 161, 468 190 S513 215, 542 164" fill="none" stroke="#d17c35" stroke-width="3" />
  <text x="469" y="239" text-anchor="middle" class="sub">各点で値を返す特徴関数</text>

  <rect x="670" y="42" width="245" height="210" class="box" />
  <text x="792" y="80" text-anchor="middle" class="main">誘導される幾何</text>
  <text x="792" y="128" text-anchor="middle" class="math">d_F(x,y)</text>
  <text x="792" y="164" text-anchor="middle" class="math">= sup |f(x) − f(y)|</text>
  <text x="792" y="211" text-anchor="middle" class="sub">特徴値の最大の違いが距離</text>

  <line x1="280" y1="148" x2="333" y2="148" class="arrow" />
  <line x1="602" y1="148" x2="655" y2="148" class="arrow" />
</svg>
