<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
  <title id="title">λ = 2 の有限枝railway mm-space：距離と点の選び方</title>
  <desc id="desc">中心Oから各枝の台の始点までの破線は長さ1。白丸は台の始点で、実線の枝は無限に続く。枝1、2、3をそれぞれ確率二分の一、三分の一、六分の一で選び、独立に密度expマイナスeの指数変数Eを選んで座標sを2足すEとする。どの枝でも座標2から3までの条件付き確率は1引くexpマイナス1。異なる枝の座標3と4の間は中心経由で距離5、同じ枝の座標3と4の間は距離1となる。</desc>
  <style>
    :root {
      --background: #f5f7fb;
      --ink: #26384b;
      --muted: #526274;
      --surface: #fff;
      --border: #dce3ec;
      --highlight: #e0a136;
      --dashed: #77869a;
      --branch-one: #246891;
      --branch-two: #9a5733;
      --branch-three: #52816c;
      --center: #526274;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #17191c;
        --ink: #e5e7eb;
        --muted: #b0b7c1;
        --surface: #22262b;
        --border: #414750;
        --highlight: #e1a54d;
        --dashed: #a0aab4;
        --branch-one: #6fb8e1;
        --branch-two: #e0a074;
        --branch-three: #78c797;
        --center: #bdc6d0;
      }
    }
  </style>
  <rect width="960" height="740" rx="16" fill="var(--background)"/>
  <g font-family="sans-serif" fill="var(--ink)">
    <text x="32" y="44" font-size="28">λ = 2 の有限枝railway mm-space</text>
    <text x="32" y="77" font-size="20">枝の座標 s と、中心からの距離 s − λ/2 を区別する</text>
  </g>

  <!-- One metric unit is 70 SVG units on every ray: (56, −42), (−56, −42), (0, 70). -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M446 226 L334 310 L166 184" stroke="var(--highlight)" stroke-width="16" opacity=".5"/>
    <path d="M334 310 L390 268 M334 310 L278 268 M334 310 L334 380" stroke="var(--dashed)" stroke-width="3" stroke-dasharray="6 7"/>
    <path d="M390 268 L558 142" stroke="var(--branch-one)" stroke-width="5"/>
    <path d="M278 268 L110 142" stroke="var(--branch-two)" stroke-width="5"/>
    <path d="M334 380 L334 492" stroke="var(--branch-three)" stroke-width="5"/>
    <path d="M547 143 L558 142 L554 153" stroke="var(--branch-one)" stroke-width="3"/>
    <path d="M114 153 L110 142 L121 143" stroke="var(--branch-two)" stroke-width="3"/>
    <path d="M328 482 L334 492 L340 482" stroke="var(--branch-three)" stroke-width="3"/>
    <path d="M345 345 L358 345" stroke="var(--dashed)" stroke-width="2"/>
  </g>
  <g fill="var(--background)" stroke="var(--center)" stroke-width="2">
    <circle cx="390" cy="268" r="7"/>
    <circle cx="278" cy="268" r="7"/>
    <circle cx="334" cy="380" r="7"/>
  </g>
  <circle cx="334" cy="310" r="5" fill="var(--center)"/>
  <circle cx="446" cy="226" r="8" fill="var(--branch-one)" stroke="var(--background)" stroke-width="2"/>
  <circle cx="502" cy="184" r="6" fill="var(--background)" stroke="var(--branch-one)" stroke-width="3"/>
  <circle cx="166" cy="184" r="8" fill="var(--branch-two)" stroke="var(--background)" stroke-width="2"/>
  <g font-family="sans-serif" fill="var(--ink)" font-size="22">
    <text x="422" y="117" fill="var(--branch-one)">枝1：p₁ = 1/2</text>
    <text x="44" y="117" fill="var(--branch-two)">枝2：p₂ = 1/3</text>
    <text x="365" y="464" fill="var(--branch-three)">枝3：p₃ = 1/6</text>
    <text x="462" y="250">s = 3</text>
    <text x="517" y="210" font-size="20">s = 4</text>
    <text x="145" y="159">t = 4</text>
    <text x="405" y="297" font-size="20">s = 2</text>
    <text x="350" y="329">O</text>
    <text x="369" y="353" font-size="20">λ/2 = 1</text>
  </g>

  <rect x="650" y="117" width="278" height="350" rx="12" fill="var(--surface)" stroke="var(--border)"/>
  <g font-family="sans-serif" fill="var(--ink)">
    <text x="672" y="155" font-size="23">異なる枝の距離</text>
    <text x="672" y="200" font-size="21">d = (s − 1) + (t − 1)</text>
    <text x="672" y="238" font-size="24">  = 2 + 3 = 5</text>
    <path d="M672 263 H906" stroke="var(--border)"/>
    <text x="672" y="298" font-size="20">中心からの長さ</text>
    <text x="672" y="339" font-size="21">s = 3：3 − 1 = 2</text>
    <text x="672" y="377" font-size="21">t = 4：4 − 1 = 3</text>
    <path d="M672 400 H906" stroke="var(--border)"/>
    <text x="672" y="438" font-size="20">同じ枝なら |3 − 4| = 1</text>
  </g>

  <g font-family="sans-serif" fill="var(--muted)" font-size="20">
    <path d="M32 548 H73" fill="none" stroke="var(--dashed)" stroke-width="3" stroke-dasharray="6 7"/>
    <text x="88" y="555">破線：台の外（各枝の始点まで長さ1）</text>
    <path d="M32 582 H73 M65 577 L73 582 L65 587" fill="none" stroke="var(--branch-three)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="589">実線：確率の台（矢印の先へ無限に続く）</text>
  </g>

  <rect x="32" y="620" width="896" height="96" rx="12" fill="var(--surface)" stroke="var(--border)"/>
  <g font-family="sans-serif" fill="var(--ink)" font-size="21">
    <text x="52" y="656">枝 i を確率 pᵢ で選ぶ → 独立に E ∼ Exp(1) を選ぶ → s = 2 + E</text>
    <text x="52" y="694">どの枝でも P(2 ≤ s ≤ 3) = 1 − e⁻¹　（始点の近くほど確率が大きい）</text>
  </g>
</svg>
