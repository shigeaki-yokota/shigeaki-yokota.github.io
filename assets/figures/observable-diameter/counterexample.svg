<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 365" role="img" aria-labelledby="title desc">
  <title id="title">狭い区間に収めると、隣り合う点が近づく</title>
  <desc id="desc">四点1, 2, 3, 4に等しい質量を置く。制限なしで測れば隣り合う二点の距離は1のままだが、区間[−1,1]に収めると、どんな写像でも、隣り合う二点のうち距離が2/3以下のものが必ず現れる。</desc>
  <style>
    :root { --background:#fff; --ink:#293a43; --border:#d9e0e4; --axis:#85949c; --guide:#c0cbd0; --good:#337a62; --bad:#b4532a; --atom:#234e76; --atom-border:#fff; }
    @media (prefers-color-scheme: dark) { :root { --background:#17191c; --ink:#e5e7eb; --border:#414750; --axis:#a2aeba; --guide:#68737f; --good:#72c49f; --bad:#f0a070; --atom:#5a9dd0; --atom-border:#17191c; } }
    text {font-family: system-ui, sans-serif; fill: var(--ink); font-size: 15px}
    .heading {font-size: 20px; font-weight: 650}
    .axis {stroke: var(--axis); stroke-width: 1.5}
    .guide {stroke: var(--guide); stroke-width: 1; stroke-dasharray: 4 4}
    .gap-good {stroke: var(--good); stroke-width: 5; fill: none}
    .gap-bad {stroke: var(--bad); stroke-width: 5; fill: none}
    .atom {fill: var(--atom); stroke: var(--atom-border); stroke-width: 2}
    .good {fill: var(--good)} .bad {fill: var(--bad)}
  </style>
  <rect x="1" y="1" width="818" height="363" rx="12" fill="var(--background)" stroke="var(--border)"/>
  <text x="410" y="34" text-anchor="middle" class="heading">四点の空間で起きること</text>
  <text x="40" y="64" font-weight="600">制限なしで測る（そのまま）</text>
  <line x1="150" y1="130" x2="690" y2="130" class="axis"/>
  <path d="M240,120 v-14 M360,120 v-14" class="gap-good"/>
  <line x1="240" y1="108" x2="360" y2="108" class="gap-good"/>
  <text x="300" y="96" text-anchor="middle" class="good">隣り合う点の距離 = 1</text>
  <circle cx="240" cy="130" r="9" class="atom"/><text x="240" y="160" text-anchor="middle">1</text>
  <circle cx="360" cy="130" r="9" class="atom"/><text x="360" y="160" text-anchor="middle">2</text>
  <circle cx="480" cy="130" r="9" class="atom"/><text x="480" y="160" text-anchor="middle">3</text>
  <circle cx="600" cy="130" r="9" class="atom"/><text x="600" y="160" text-anchor="middle">4</text>
  <line x1="40" y1="186" x2="780" y2="186" class="guide"/>
  <text x="40" y="214" font-weight="600">区間 [−1, 1] に収めて測る</text>
    <line x1="150" y1="270" x2="690" y2="270" class="axis"/>
  <line x1="300" y1="258" x2="300" y2="282" class="axis"/><line x1="540" y1="258" x2="540" y2="282" class="axis"/>
  <line x1="300" y1="248" x2="380" y2="248" class="gap-bad"/>
  <text x="340" y="236" text-anchor="middle" class="bad">2/3</text>
  <circle cx="300" cy="270" r="9" class="atom"/><text x="300" y="302" text-anchor="middle">−1</text>
  <circle cx="380" cy="270" r="9" class="atom"/><text x="380" y="302" text-anchor="middle">−1/3</text>
  <circle cx="460" cy="270" r="9" class="atom"/><text x="460" y="302" text-anchor="middle">1/3</text>
  <circle cx="540" cy="270" r="9" class="atom"/><text x="540" y="302" text-anchor="middle">1</text>
  <text x="410" y="332" text-anchor="middle" class="bad">どう収めても、距離 2/3 以下の組ができる</text>
  <text x="410" y="352" text-anchor="middle" class="bad" font-size="14">最良の収め方でも 2/3：−1, −1/3, 1/3, 1</text>
</svg>
