<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
  <title id="title">Distinct singleton geometric data sets remain one unit apart</title>
  <desc id="desc">Two singleton spaces have feature-value sets A equals 1, 3, 6 and B equals 1, 4, 6. Shared values match, while the unmatched values 3 and 4 differ by one. Any distinct subsets of the integers have an unmatched value at distance at least one from the other subset.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--difference)"/>
    </marker>
    <style>
      :root {
        --background: #fff;
        --ink: #26343d;
        --muted: #53616a;
        --border: #d7dde1;
        --line: #84919a;
        --node: #2c7182;
        --match: #91b9a4;
        --difference: #9a4938;
        --difference-ink: #873f31;
        --difference-box: #fff;
        --difference-border: #e5c2b8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #17191c;
          --ink: #e5e7eb;
          --muted: #b0b7c1;
          --border: #414750;
          --line: #9aa6b2;
          --node: #347f91;
          --match: #91c9a8;
          --difference: #d88772;
          --difference-ink: #f2b7a7;
          --difference-box: #22262b;
          --difference-border: #8b6259;
        }
      }
      text { font-family: system-ui, sans-serif; fill: var(--ink); }
      .title { font-size: 23px; font-weight: 650; }
      .label { font-size: 18px; font-weight: 600; }
      .value { font-size: 21px; font-weight: 650; }
      .value text { fill: #fff; }
      .small { font-size: 15px; fill: var(--muted); }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="348" rx="14" fill="var(--background)" stroke="var(--border)" stroke-width="2"/>
  <text class="title" x="480" y="42" text-anchor="middle">Same point, different sets of feature values</text>
  <text class="label" x="245" y="92" text-anchor="middle">*ₐ　 A = {1, 3, 6}</text>
  <text class="label" x="715" y="92" text-anchor="middle">*ᵦ　 B = {1, 4, 6}</text>
  <line x1="245" y1="150" x2="245" y2="247" stroke="var(--line)" stroke-width="3"/>
  <line x1="715" y1="150" x2="715" y2="247" stroke="var(--line)" stroke-width="3"/>
  <g fill="var(--node)" stroke="var(--background)" stroke-width="3">
    <circle cx="245" cy="150" r="17"/><circle cx="245" cy="199" r="17"/><circle cx="245" cy="247" r="17"/>
    <circle cx="715" cy="150" r="17"/><circle cx="715" cy="199" r="17"/><circle cx="715" cy="247" r="17"/>
  </g>
  <g class="value" text-anchor="middle" fill="#fff">
    <text x="245" y="157" fill="#fff">1</text><text x="245" y="206" fill="#fff">3</text><text x="245" y="254" fill="#fff">6</text>
    <text x="715" y="157" fill="#fff">1</text><text x="715" y="206" fill="#fff">4</text><text x="715" y="254" fill="#fff">6</text>
  </g>
  <g stroke="var(--match)" stroke-width="3" stroke-dasharray="7 7">
    <line x1="270" y1="150" x2="690" y2="150"/><line x1="270" y1="247" x2="690" y2="247"/>
  </g>
  <line x1="275" y1="199" x2="685" y2="199" stroke="var(--difference)" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <rect x="443" y="177" width="74" height="43" rx="8" fill="var(--difference-box)" stroke="var(--difference-border)"/>
  <text class="label" x="480" y="205" text-anchor="middle" fill="var(--difference-ink)">Δ = 1</text>
  <text class="small" x="480" y="296" text-anchor="middle">Shared values match. An unmatched integer is at least distance 1 from every value on the other side.</text>
  <text class="small" x="480" y="324" text-anchor="middle">Thus all distinct A, B have observable distance 1. This example illustrates the general mechanism.</text>
</svg>
